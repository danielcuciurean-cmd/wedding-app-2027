<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a3b4e">
  <title>Nunta 2027</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card">
      <h1>Nunta 2027</h1>
      <label>Email <input type="email" name="email" required autocomplete="username"></label>
      <label>Parolă <input type="password" name="password" required autocomplete="current-password"></label>
      <p id="login-error" class="error"></p>
      <button class="btn primary" type="submit">Intră</button>
    </form>
  </div>
  <div id="app" class="app hidden">
    <header class="topbar">
      <strong>Nunta 2027</strong>
      <span id="offline-badge" class="badge hidden">offline</span>
      <button id="logout" class="btn small">Ieși</button>
    </header>
    <main id="view"></main>
    <nav id="nav" class="nav"></nav>
  </div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
